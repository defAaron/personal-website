        - separator [ref=f1e272]
        - generic [ref=f1e273]:
          - paragraph [ref=f1e274]: the crowd lines up behind the door that leads to success 90% of the time
          - paragraph [ref=f1e275]: success waits behind the door that the crowd is lined up for 10% of the time
          - paragraph [ref=f1e276]:
            - strong [ref=f1e277]: "what this means:"
          - list [ref=f1e278]:
            - listitem [ref=f1e279]: – following the crowd is almost never a bad idea. attention and hype is never all for nothing, especially in an environment where knowledge is distributed, research is a mindset, and ambition is a lifestyle
            - listitem [ref=f1e280]: – to be mindful of one’s own capabilities and to control your focus is a greater power.
            - listitem [ref=f1e281]: "– side-note: self-control is a rather blunt and ambiguous term, but representing this notion as a single word is too thought-provoking for me. I’m frustrated to spend so much time on vocabulary during a flow state of writing."
            - listitem [ref=f1e282]:
              - text: – be creative, be original, but
              - strong [ref=f1e283]: do not FORCE yourself to be original
              - text: . it’s completely fine if you’ve thought about building something, writing something, or creating anything, but it’s already been done. chances are that your passion, determination, skills, and the journey you take while creating the product will differentiate your end result from everything else. along with this, you will now be carrying a story to tell to people of what/why/when/where/how you’ve created.
            - listitem [ref=f1e284]:
              - text: – creation does not necessarily have to be invention. but invention also does not necessarily have to be completely new. when I hear “necessity is the mother of invention,” I think “what is necessity assigned to? Is it to the world? Is it to all the people? Is it to a specific group of people, or to a singular person?” But recently, I’ve taken a more internal view to this quote. That person just might be
              - strong [ref=f1e285]: you
              - text: . It might help you, not in a physical/practical way, like people would expect. Maybe it just helped you gain a stronger understanding of an environment, a person, an idea, or the world in general.
            - listitem [ref=f1e286]: – sometimes the problem behind a motivation is obscured. sometimes you will not be able to concretely define what you wish to solve. as an engineer, this might be one of the most distrurbing thoughts you can have, because a key aspect of engineering is hyperfixating the workflow on that problem, and optimizing your process and build plan to be as efficient as possible. how are we to define a plan when we do not even know what it is for? of course, we know what it will do, but in an age where slop is getting more and more prevalent in the field of creativity, I feel a genuine fear of my creations leaning towards being in that pile of garbage. the solution for this is just to create, evaluate, and repeat. challenge the meaning of direction. a little analogy (that might only make sense in my head) could be the following. imagine your goal is to journey to the North. N 1˚ E still means you are moving North. It also means you are moving East. East may provide additional benefits, or may hinder your project. But it is better than moving South.