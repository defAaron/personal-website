          - generic [ref=f5e27]: Where I'M From
          - heading "I was born and raised in Utica, NY. My Dad worked as a mail carrier for the Post Office. My Mom worked as a Kindergarten Teacher. Growing up they repeatedly told me to get off the computer and go outside. The OG Touch Grass™. I'm glad I did. There's not a ton to do in Utica but there is a ton to eat and the food is definitely better than where you're from." [level=1] [ref=f5e28]
        - generic [ref=f5e29]:
